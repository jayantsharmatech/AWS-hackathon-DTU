service: ecobuild-backend

frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.11
  region: ap-south-1
  httpApi:
    cors: true  # <--- THIS AUTOMATICALLY HANDLES ALL OPTIONS PREFLIGHT & CORS HEADERS
  environment:
    GEMINI_API_KEY: ${env:GEMINI_API_KEY}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:ListBucket
          Resource:
            - "arn:aws:s3:::ecobuild-raw-media-bucket"
            - "arn:aws:s3:::ecobuild-raw-media-bucket/*"
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:DeleteItem
          Resource: "arn:aws:dynamodb:*:*:table/EcoBuildCore"

functions:
  processListing:
    handler: lambdas/process_listing.lambda_handler
    events:
      # 1. Triggered when files are uploaded to S3 (Gemini Processing)
      - s3:
          bucket: ecobuild-raw-media-bucket
          event: s3:ObjectCreated:*
          existing: false
      # 2. HTTP GET endpoint for React frontend to fetch listings
      - httpApi:
          path: /listings
          method: get
      # 3. HTTP POST endpoint for React frontend to create listings
      - httpApi:
          path: /listings
          method: post
      # 4. HTTP DELETE endpoint for React frontend to remove listings
      - httpApi:
          path: /listings
          method: delete

resources:
  Resources:
    EcoBuildTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: EcoBuildCore
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: category
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: CategoryIndex
            KeySchema:
              - AttributeName: category
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL